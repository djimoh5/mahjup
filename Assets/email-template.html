<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahjUp Email Template</title>
    <style>
        /* Reset styles for email clients */
        body, table, td, a { text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f4f4f4; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        /* Custom styling */
        .wrapper { width: 100%; table-layout: fixed; background-color: #f4f4f4; padding-top: 20px; padding-bottom: 40px; }
        .main-table { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { background-color: #e8877a; padding: 17px 20px; text-align: center; }
        .logo { max-width: 180px; height: auto; display: block; margin: 0 auto; }
        .content { padding: 40px 30px; color: #333333; line-height: 1.6; font-size: 16px; }
        .heading { color: #e8877a; font-size: 24px; font-weight: bold; margin-top: 0; margin-bottom: 20px; }
        .button-container { text-align: center; margin: 30px 0; }
        .button { background-color: #e8877a; color: #ffffff !important; text-decoration: none; padding: 12px 30px; font-weight: bold; border-radius: 5px; display: inline-block; transition: background-color 0.3s; }
        .footer { background-color: #f4f4f4; text-align: center; padding: 20px; font-size: 12px; color: #777777; }
        .footer a { color: #e8877a; text-decoration: none; }
    </style>
</head>
<body>

    <center class="wrapper">
        <table class="main-table" width="100%" cellspacing="0" cellpadding="0" border="0">
            
            <tr>
                <td class="header">
                    <img src="https://s3.us-east-1.amazonaws.com/mahjup.release/assets/mahjup-logo-light.png" alt="MahjUp Logo" class="logo">
                </td>
            </tr>
            
            <tr>
                <td class="content">
                    <h1 class="heading">*|title|*</h1>
                    *|main_content|*
                    
                    <table class="button-container" width="100%" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                            <td>
                                <a href="*|button_link|*" target="_blank" class="button">*|button_text|*</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            
            <tr>
                <td class="footer">
                    <p>&copy; 2026 MahjUp. All rights reserved.</p>
                    <p>*|footer_text|*</p>
                </td>
            </tr>
            
        </table>
    </center>

</body>
</html>
