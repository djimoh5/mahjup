<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="-apple-system, system-ui, sans-serif">
  <rect width="800" height="200" fill="#fafafa"/>
  
  <!-- ============ Stacked offset tiles (left side) ============ -->
  <!-- Tiles span y=60 to y=165 (height 105), centered on y=112.5 which aligns with text center -->
  <g transform="translate(50, 60)">
    
    <!-- Bottom tile: Bamboo (3 bam) -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="60" height="75" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
      <rect x="4" y="4" width="52" height="67" rx="5" fill="#f5f5f0" stroke="#1a1a1a" stroke-width="1"/>
      <!-- 3 vertical bamboo sticks -->
      <g stroke="#1a8754" stroke-width="2.5" fill="#1a8754">
        <!-- Left bamboo -->
        <line x1="20" y1="20" x2="20" y2="55" stroke-linecap="round"/>
        <circle cx="20" cy="22" r="2.5"/>
        <circle cx="20" cy="37" r="2.5"/>
        <circle cx="20" cy="53" r="2.5"/>
        <!-- Middle bamboo -->
        <line x1="30" y1="20" x2="30" y2="55" stroke-linecap="round"/>
        <circle cx="30" cy="22" r="2.5"/>
        <circle cx="30" cy="37" r="2.5"/>
        <circle cx="30" cy="53" r="2.5"/>
        <!-- Right bamboo -->
        <line x1="40" y1="20" x2="40" y2="55" stroke-linecap="round"/>
        <circle cx="40" cy="22" r="2.5"/>
        <circle cx="40" cy="37" r="2.5"/>
        <circle cx="40" cy="53" r="2.5"/>
      </g>
    </g>
    
    <!-- Middle tile: Dots (3 dot) -->
    <g transform="translate(22, 15)">
      <rect x="0" y="0" width="60" height="75" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
      <rect x="4" y="4" width="52" height="67" rx="5" fill="#f5f5f0" stroke="#1a1a1a" stroke-width="1"/>
      <!-- 3 dots stacked vertically -->
      <circle cx="30" cy="22" r="6.5" fill="#d62828" stroke="#1a1a1a" stroke-width="1.2"/>
      <circle cx="30" cy="22" r="2.5" fill="#f5f5f0"/>
      <circle cx="30" cy="38" r="6.5" fill="#1a8754" stroke="#1a1a1a" stroke-width="1.2"/>
      <circle cx="30" cy="38" r="2.5" fill="#f5f5f0"/>
      <circle cx="30" cy="54" r="6.5" fill="#d62828" stroke="#1a1a1a" stroke-width="1.2"/>
      <circle cx="30" cy="54" r="2.5" fill="#f5f5f0"/>
    </g>
    
    <!-- Top tile: Red Dragon (中) -->
    <g transform="translate(44, 0)">
      <rect x="0" y="0" width="60" height="75" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
      <rect x="4" y="4" width="52" height="67" rx="5" fill="#f5f5f0" stroke="#1a1a1a" stroke-width="1"/>
      <!-- Chinese character 中 (zhōng) - Red Dragon tile -->
      <text x="30" y="52" text-anchor="middle" font-size="46" font-weight="700" fill="#d62828" font-family="'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', sans-serif">中</text>
    </g>
  </g>
  
  <!-- ============ Wordmark (right side) - vertically centered ============ -->
  <!-- Tiles center at y=112.5, text baseline placed so cap-height centers there -->
  <text x="200" y="142" font-size="100" font-weight="800" fill="#1a1a1a" letter-spacing="-2">
    Mahj<tspan fill="#d62828">Up</tspan>
  </text>
</svg>
